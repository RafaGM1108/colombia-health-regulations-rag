version: 2
updates:
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    groups:
      python:
        patterns: ["*"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    ignore:
      # The project is pinned to Python 3.12 (requires-python and the uv builder image);
      # a newer Python in the runtime image would break the virtualenv copied into it.
      - dependency-name: python
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
