name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  preflight:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.2
        with:
          python-version: "3.12"
          enable-cache: true
      - name: Verify lockfile
        run: uv lock --check
      - name: Install locked dependencies
        run: uv sync --frozen

  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.2
        with:
          python-version: "3.12"
          enable-cache: true
      - name: Install locked dependencies
        run: uv sync --frozen
      - name: Formatting, lint, documentation, and security
        run: make lint typecheck

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.2
        with:
          python-version: "3.12"
          enable-cache: true
      - name: Install locked dependencies
        run: uv sync --frozen
      - name: Tests with coverage
        run: make test
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            report.xml
            coverage.xml
          if-no-files-found: warn
