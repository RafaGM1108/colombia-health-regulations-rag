site_name: Colombian Health Regulations RAG
site_description: Official-source retrieval with article-level citations
site_author: Rafael E. Garcia
repo_url: https://github.com/RafaGM1108/colombia-health-regulations-rag
theme:
  name: material
  features:
    - navigation.sections
    - content.code.copy
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
markdown_extensions:
  - admonition
  - tables
  - pymdownx.superfences
nav:
  - Home: index.md
  - Methodology: methodology.md
  - Data: data.md
